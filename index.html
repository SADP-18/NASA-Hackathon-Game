<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Outpost Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div id="topBar">
            <h1>Outpost Architect</h1>
            <div id="hud">
                <div class="hud-item">
                    <span class="label">Power</span>
                    <span class="value" id="hud-power">50/100</span>
                </div>
                <div class="hud-item">
                    <span class="label">Manpower</span>
                    <span class="value" id="hud-manpower">5</span>
                </div>
                <div class="hud-item">
                    <span class="label">Oxygen</span>
                    <span class="value" id="hud-oxygen">100%</span>
                </div>
                <div class="hud-item">
                    <span class="label">Food</span>
                    <span class="value" id="hud-food">50</span>
                </div>
                <div class="hud-item">
                    <span class="label">Stress</span>
                    <span class="value" id="hud-stress">0%</span>
                </div>
                <div class="hud-item">
                    <span class="label">Radiation</span>
                    <span class="value" id="hud-radiation">0%</span>
                </div>
                <div class="hud-item">
                    <span class="label">Credits</span>
                    <span class="value" id="hud-credits">$50</span>
                </div>
                <div class="hud-item">
                    <span class="label">Day</span>
                    <span class="value" id="hud-day">Day 1</span>
                </div>
                <div class="hud-item">
                    <span class="label">Time</span>
                    <span class="value" id="hud-time">00:00</span>
                </div>
                <div class="hud-item">
                    <span class="label">Level</span>
                    <span class="value" id="hud-level">1/3</span>
                </div>
            </div>
        </div>

        <div id="game">
            <aside id="sidePanel">
                <h2>Build Menu</h2>
                <div id="buildMenu"></div>
                
            </aside>

            <canvas id="gridCanvas"></canvas>

            <aside id="rightPanel">
                <h2>Outpost Log</h2>
                <div id="log"></div>
                <button id="restartBtn">Restart</button>
            </aside>

            <aside id="controlPanel">
                <button id="pauseBtn" title="Pause / Resume (P)">
                    <span class="pause-icon"></span>
                    <span id="pauseBtnLabel">PAUSE</span>
                </button>
            </aside>
        </div>
    </div>

    <div id="overlay" class="hidden">
        <h2 id="overlayTitle">OUTPOST LOST</h2>
        <p id="overlayMsg"></p>
        <button id="nextLevelBtn" class="hidden">Next Level</button>
    </div>

    <script type="module" src="/src/main.ts"></script>

<footer style="margin-top: 20px; font-size: 11px; color: var(--text-dim); text-align: center;">
    Educational mechanics and hazards modeled on real data from the 
    <strong>NASA DONKI</strong> (Space Weather) database.
</footer>
</body>
</html>
