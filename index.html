<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Outpost</title>
    </head>
    <body>
        <h1>OUTPOST COMMAND</h1>

        <div id="game">
            <div id="leftPanel">
                <canvas id="gridCanvas" width="500" height="500"></canvas>
                <div id="hud">
                    <div class="stat">
                        <span class="label">Power</span>
                        <span class="value" id="stat-power">50</span>
                    </div>
                    <div class="stat">
                        <span class="label">O₂</span>
                        <span class="value" id="stat-o2">30</span>
                    </div>
                    <div class="stat">
                        <span class="label">Food</span>
                        <span class="value" id="stat-food">20</span>
                    </div>
                    <div class="stat">
                        <span class="label">Rad</span>
                        <span class="value" id="stat-rad">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Turn</span>
                        <span class="value" id="stat-turn">1</span>
                    </div>
                </div>
            </div>

            <div id="rightPanel">
                <div id="moduleList"></div>
                <div id="actions">
                    <button id="endTurnBtn">End Turn</button>
                    <button id="restartBtn">Restart</button>
                </div>
                <div id="log"></div>
            </div>
        </div>

        <div id="gameOver" class="hidden">
            <h2>GAME OVER</h2>
            <div id="gameOverReason"></div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
